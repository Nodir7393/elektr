# Frontend (Vite/React SPA — statik) — /etc/nginx/sites-available/qiyom.pcbuild.uz
# Eski localhost:3000 proxy o'rniga current/pwa/dist statik fayllari (SPA fallback).
server {
    server_name qiyom.pcbuild.uz;

    root /var/www/qiyom/current/pwa/dist;
    index index.html;

    # SPA — barcha yo'llar index.html ga (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashli asset'lar — uzoq cache
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/qiyom.pcbuild.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/qiyom.pcbuild.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = qiyom.pcbuild.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name qiyom.pcbuild.uz;
    return 404; # managed by Certbot
}
