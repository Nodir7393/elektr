# Backend (Laravel API) — /etc/nginx/sites-available/qiyomapi.pcbuild.uz
# Yangi versiya: root -> current/api/public (zero-downtime symlink).
server {
    server_name qiyomapi.pcbuild.uz;

    root /var/www/qiyom/current/api/public;
    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;
    client_max_body_size 50M;          # Excel import uchun

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/qiyomapi.pcbuild.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/qiyomapi.pcbuild.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = qiyomapi.pcbuild.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name qiyomapi.pcbuild.uz;
    return 404; # managed by Certbot
}
