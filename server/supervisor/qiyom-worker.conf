# /etc/supervisor/conf.d/qiyom-worker.conf
# Laravel queue worker. Hozircha app queue'ga job dispatch qilmaydi (ixtiyoriy),
# ammo shared/.env QUEUE_CONNECTION=database bo'lsa worker tayyor turadi.
[program:qiyom-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/qiyom/current/api/artisan queue:work --sleep=3 --tries=3 --timeout=90
autostart=true
autorestart=true
numprocs=2
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/qiyom/worker.log
stopwaitsecs=3600
